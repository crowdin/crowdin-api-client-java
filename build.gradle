plugins {
    id 'java-library'
}

plugins {
    id 'jacoco'
}

plugins {
    id 'java'
}

task myJavadocs(type: Javadoc) {
    source = sourceSets.main.allJava
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Gradle 9 runs on JDK 17+; compile the library against the Java 8 API, not just Java 8 bytecode
compileJava {
    options.release = 8
}

// lombok.var is rejected by javadoc newer than 9 unless the source level is 8
tasks.withType(Javadoc).configureEach {
    options.source = '8'
}

version '1.38.0'

repositories {
    mavenCentral()
}

dependencies {

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api','org.mockito:mockito-core:4.11.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
}

test {
    useJUnitPlatform()
}

// Runs the built jar on a real Java 8 runtime (Gradle itself needs JDK 17+); needs a JDK 8 installed
sourceSets {
    java8Smoke
}

configurations {
    java8SmokeImplementation.extendsFrom implementation
}

dependencies {
    java8SmokeImplementation files(tasks.named('jar'))
}

compileJava8SmokeJava {
    options.release = 8
}

tasks.register('java8SmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the built library on a Java 8 runtime.'
    classpath = sourceSets.java8Smoke.runtimeClasspath
    mainClass = 'com.crowdin.client.smoke.Java8SmokeTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

jar {
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}

wrapper {
    gradleVersion = '9.8.2'
}

jacoco {
    toolVersion = "0.8.16"
    reportsDirectory = layout.buildDirectory.dir("reports")
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        xml.outputLocation = layout.buildDirectory.file("coverage.xml")
    }

    getExecutionData().setFrom(layout.buildDirectory.file("jacoco/test.exec"))
}
