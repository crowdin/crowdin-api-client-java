version: 2

updates:
  # Gradle dependencies declared in build.gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    # Java 8 compatibility: JUnit 6 requires Java 17 and Mockito 5 requires Java 11.
    ignore:
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mockito:*"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR a month for all routine minor/patch bumps.
      gradle:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security fixes are alert-driven, not monthly, and are not limited to
      # minor/patch so a fix released only in a major version still arrives.
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
