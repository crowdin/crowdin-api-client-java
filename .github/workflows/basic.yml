name: Tests

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - '*'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 8 is only for the smoke test below; the last one listed (17) runs Gradle
          java-version: |
            8
            17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Run Tests
        run: ./gradlew test

      - name: Run Java 8 compatibility smoke test
        run: ./gradlew java8SmokeTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Generate code coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
